<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0f172a" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('medvault-theme');
      var theme = saved === 'light' || saved === 'dark' ? saved :
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#080c17' : '#f3f6fb';
    } catch (_) { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
<title>MedVault — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<button id="frame-toggle" type="button">📱 Frame</button>

<div class="phone">
  <div class="phone__screen" id="screen">
    <div id="root"></div>
    <div id="sheet-root"></div>
    <div id="fullscreen-root"></div>
    <div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>
  </div>
</div>

<!-- Load order matters. Each script depends only on files above it. -->
